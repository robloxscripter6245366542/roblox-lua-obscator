<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Vaultix Staff</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .apanel { padding: 32px 0 60px; }
    .apanel h1 { font-size: 2rem; letter-spacing: -.03em; margin: 0 0 6px; }
    .login { display: flex; gap: 8px; max-width: 460px; margin-top: 20px; }
    .login input { flex: 1; height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); }
    .atabs { display: flex; gap: 4px; margin-top: 20px; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .atabs button { height: 46px; padding: 0 16px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 600; cursor: pointer; white-space: nowrap; }
    .atabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--brand); }
    .atabs .count { margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--risk); color: #fff; font-size: .75rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: .92rem; }
    th { text-align: left; font: 500 .75rem var(--mono); text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
    td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: top; word-break: break-word; }
    td .btn { height: 32px; padding: 0 10px; font-size: .82rem; }
    td .small { color: var(--muted); }
    .acts { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
    .filter-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .filter, .filter-row select { height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); max-width: 320px; width: 100%; }
    .filter-row select { width: auto; }
    .logins { display: grid; gap: 8px; margin-top: 8px; }
    .login-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px; border-radius: 8px; background: var(--card); border: 1px solid rgba(255, 216, 77, .35); }
    .login-card .mono { line-height: 1.6; word-break: break-all; }
    .detail { margin-top: 6px; padding: 8px 10px; border-radius: 8px; background: var(--card); font-size: .85rem; white-space: pre-wrap; }
    @media (max-width: 760px) {
      thead { display: none; }
      tr { display: grid; grid-template-columns: 1fr; padding: 10px 0; border-bottom: 1px solid var(--line); }
      td { border: 0; padding: 4px 0; }
      .acts { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="demo-bar" id="demoBar" hidden>Demo mode — showing sellers saved in this browser only. Orders and payouts need the server.</div>
  <header class="top">
    <div class="wrap top-inner">
      <a href="./" class="brand"><img src="logo.svg" alt="" width="30" height="30" /><span>Vaultix</span></a>
      <span class="mono muted">Staff</span>
      <div class="top-actions"><a class="btn ghost" href="./">Back to market</a></div>
    </div>
  </header>

  <main class="wrap apanel">
    <h1>Staff</h1>
    <p class="muted">Verify sellers, settle disputes and send withdrawals.</p>

    <form class="login" id="login">
      <input type="password" id="key" placeholder="Admin key" autocomplete="current-password" aria-label="Admin key" />
      <button class="btn sell" type="submit">Unlock</button>
    </form>
    <p class="form-err" id="err" role="alert"></p>

    <div id="app" hidden>
      <nav class="atabs" role="tablist" id="tabs"></nav>
      <div id="view"></div>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script src="games.js"></script>
  <script src="data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
