# Render blueprint for Vaultix Market (https://render.com/docs/blueprint-spec)
# Render → New → Blueprint → pick this repo. It creates one free web service that runs
# shop-site/server.js (site + API) and redeploys whenever main changes.
services:
  - type: web
    name: vaultix
    runtime: node
    plan: free
    branch: main
    buildCommand: echo "No build step needed"
    startCommand: node shop-site/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    buildFilter:
      paths:
        - shop-site/**
        - api/market.js
        - api/stripe-webhook.js
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Database (free at upstash.com). Leave empty at first: the site runs in demo mode.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Staff page password: pick a long random one.
      - key: MARKET_ADMIN_KEY
        sync: false
      # Owner usernames (reserved; claiming one needs MARKET_ADMIN_KEY).
      - key: MARKET_OWNERS
        value: Kaitrades
      # Encrypts account logins for instant delivery. Long random string; never change it later.
      - key: MARKET_ENCRYPTION_KEY
        sync: false
      # "Forgot password" emails (resend.com). Without them, staff reset passwords by hand.
      - key: RESEND_API_KEY
        sync: false
      - key: MARKET_EMAIL_FROM
        sync: false
      # Stripe (use sk_test_… keys while testing).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
